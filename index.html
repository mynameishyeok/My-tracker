<script>
  // 진짜 브라우저 저장소(localStorage) 기반 저장소 - Claude 아티팩트의 window.storage와 동일한 인터페이스로 흉내냄
  window.storage = {
    get: function (key) {
      return Promise.resolve((function () {
        try {
          var v = localStorage.getItem(key);
          return v !== null ? { value: v } : null;
        } catch (e) { return null; }
      })());
    },
    set: function (key, value) {
      return Promise.resolve((function () {
        try {
          localStorage.setItem(key, value);
          return { value: value };
        } catch (e) { return null; }
      })());
    },
  };
</script>

function getHoliday(dateStr, lang) {
  const [y, m, d] = dateStr.split("-");
  const md = `${m}-${d}`;
  const fixed = FIXED_HOLIDAYS.find((h) => h.md === md);
  if (fixed) return fixed[lang];
  const variable = VARIABLE_HOLIDAYS[y];
  if (variable && variable[md] !== undefined) return variable[md][lang];
  return undefined;
}

function pad(n) {
  return n < 10 ? "0" + n : "" + n;
}
function toDateStr(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

// ---- 한글 초성 검색 지원 ----
const CHO = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
function toChoseong(str) {
  let result = "";
  for (const ch of str) {
    const code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) {
      const choIndex = Math.floor((code - 0xac00) / 588);
      result += CHO[choIndex];
    } else {
      result += ch;
    }
  }
  return result;
}
function isChoseongOnly(str) {
  return str.length > 0 && [...str].every((ch) => CHO.includes(ch));
}
function matchesSearch(target, query) {
  if (!query) return false;
  const t = (target || "").toLowerCase();
  const q = query.toLowerCase();
  if (t.includes(q)) return true;
  if (isChoseongOnly(query)) {
    return toChoseong(target || "").includes(query);
  }
  return false;
}
function chipStyle(selected) {
  return {
    padding: "6px 12px",
    borderRadius: 6,
    fontSize: 12.5,
    whiteSpace: "nowrap",
    border: selected ? `1px solid ${T.accent}` : `1px solid ${T.border}`,
    background: selected ? T.accent : "#fff",
    color: selected ? "#fff" : T.chipText,
    cursor: "pointer",
    flexShrink: 0,
    display: "inline-flex",
    alignItems: "center",
    gap: 6,
  };
}
function Dot({ color }) {
  return <span style={{ width: 6, height: 6, borderRadius: "50%", background: color, display: "inline-block", flexShrink: 0 }} />;
}
function Checkbox({ done, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        width: 16,
        height: 16,
        borderRadius: 4,
        border: done ? "none" : "1.5px solid #D3D1CB",
        background: done ? T.accent : "transparent",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        flexShrink: 0,
        cursor: "pointer",
        padding: 0,
      }}
    >
      {done && "✓"}
    </button>
  );
}

  useEffect(() => {

            justFired = t;

              if (typeof Notification !== "undefined" && Notification.permission === "granted") {

            return { ...t, reminderFired: true };

  function formatWeekRangeLabel(weekStartStr) {

    return language === "ko"

  }

      ? `다음은 "${proj.name}" 프로젝트의 ${weekLabel} 주간 기록이야.

이번 주 목표: ${goal}

완료한 일:
${doneList.length ? doneList.join("\n") : "(없음)"}

완료하지 못한 일:
${undoneList.length ? undoneList.join("\n") : "(없음)"}

이 내용을 바탕으로 이번 주에 무엇을 달성했고 무엇을 놓쳤는지 3~4줄로 담백하게 한국어로 요약해줘. 불릿 없이 짧은 문단으로 써줘.`
      : `Here is the ${weekLabel} weekly log for the "${proj.name}" project.

This week's goal: ${goal}

Completed:
${doneList.length ? doneList.join("\n") : "(none)"}

Not completed:
${undoneList.length ? undoneList.join("\n") : "(none)"}

Write a plain, natural 3-4 sentence summary in English of what was accomplished and what was missed this week. Short paragraph, no bullet points.`;

    setAiLoadingId(projectId);
    if (!GEMINI_API_KEY || GEMINI_API_KEY.indexOf("여기에") !== -1) {
      saveWeeklySummaries({
        ...weeklySummaries,
        [key]: { text: language === "ko" ? "먼저 코드 상단의 GEMINI_API_KEY 자리에 발급받은 키를 넣어주세요." : "Please add your Gemini API key to GEMINI_API_KEY near the top of the code first.", generatedAt: new Date().toISOString() },
      });
      setAiLoadingId(null);
      return;

    try {

        {

          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
        }
      );
      const data = await response.json();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const text = parts.map((p) => p.text || "").join("\n").trim();

                  <button

                    <div style={{ flex: 1, minWidth: 0 }}>

                      >

                    <button

                    >

                          "✕"
                        </button>
                      </div>
                      <div style={{ fontSize: 12, color: T.textSecondary, marginBottom: 6 }}>
                        {L.totalDone(pt.length, done)}
                      </div>
                      <div style={{ height: 4, background: T.track, borderRadius: 2, overflow: "hidden" }}>
                        <div style={{ height: "100%", width: `${pct}%`, background: T.text, borderRadius: 2 }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === "calendar" && (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <button
                onClick={() => goMonth(-1)}
                style={{ background: "#fff", border: `1px solid ${T.border}`, borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: T.text , fontSize: 18 }}
              >
                "‹"
              </button>
              <div style={{ fontSize: 15, fontWeight: 600 }}>
                {language === "ko" ? `${viewYear}년 ${viewMonth}월` : fmtDate(new Date(viewYear, viewMonth - 1, 1), { month: "long", year: "numeric" })}
              </div>
              <button
                onClick={() => goMonth(1)}
                style={{ background: "#fff", border: `1px solid ${T.border}`, borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: T.text , fontSize: 18 }}
              >
                "›"
              </button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginBottom: 4 }}>
              {WD.map((w, i) => (
                <div
                  key={w}
                  style={{
                    textAlign: "center",
                    fontSize: 11,
                    fontWeight: 500,
                    color: i === 0 ? T.sun : i === 6 ? T.sat : T.textSecondary,
                    padding: "4px 0",
                  }}
                >
                  {w}
                </div>
              ))}
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
              {gridDates.map((d, i) => {
                const inMonth = d.getMonth() + 1 === viewMonth;
                const ds = toDateStr(d);
                const holiday = getHoliday(ds, language);
                const isToday = ds === todayStr;
                const hasNote = !!notes[ds];
                const dow = d.getDay();
                return (
                  <button
                    key={i}
                    onClick={() => openDay(d)}
                    style={{
                      aspectRatio: "1",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      justifyContent: "flex-start",
                      paddingTop: 4,
                      borderRadius: 6,
                      border: isToday ? `1px solid ${T.accent}` : "1px solid transparent",
                      background: holiday && inMonth ? T.holidayBg : "#fff",
                      opacity: inMonth ? 1 : 0.35,
                      cursor: "pointer",
                      position: "relative",
                    }}
                  >
                    <span
                      style={{
                        fontSize: 12.5,
                        fontWeight: isToday ? 600 : 400,
                        color: holiday ? T.holidayText : dow === 0 ? T.sun : dow === 6 ? T.sat : T.text,
                      }}
                    >
                      {d.getDate()}
                    </span>
                    {holiday && inMonth && (
                      <span style={{ fontSize: 8, color: T.holidayText, marginTop: 1, lineHeight: 1.1, textAlign: "center" }}>{holiday}</span>
                    )}
                    {hasNote && (
                      <span style={{ position: "absolute", bottom: 4, width: 4, height: 4, borderRadius: "50%", background: T.accent }} />
                    )}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 11, color: T.textMuted, marginTop: 12, textAlign: "center" }}>
              {L.calendarHint}
            </div>
          </div>
        )}
      </div>

      <div
        onTouchStart={handleNavTouchStart}
        onTouchEnd={handleNavTouchEnd}
        style={{ borderTop: `1px solid ${T.border}`, background: "#fff" }}
      >
        <div style={{ display: "flex" }}>
          {NAV_PAGES[navPageIndex].map((key) => {
            return (
              <button
                key={key}
                onClick={() => setTab(key)}
                style={{
                  flex: 1,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 2,
                  padding: "14px 0 10px",
                  background: "none",
                  border: "none",
                  cursor: "pointer",
                  color: tab === key ? T.accent : T.textMuted,
                }}
              >
                <span style={{ fontSize: 14, fontWeight: tab === key ? 700 : 500 }}>{L[key]}</span>
              </button>
            );
          })}
        </div>
        <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 5, paddingBottom: 7 }}>
          {NAV_PAGES.map((_, i) => (
            <button
              key={i}
              onClick={() => setNavPageIndex(i)}
              style={{
                width: i === navPageIndex ? 14 : 5,
                height: 5,
                borderRadius: 3,
                background: i === navPageIndex ? T.accent : T.border,
                border: "none",
                padding: 0,
                cursor: "pointer",
                transition: "width 0.15s",
              }}
            />
          ))}
        </div>
      </div>

      {selectedDate && (
        <div
          onClick={() => setSelectedDate(null)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.4)",
            display: "flex",
            alignItems: "flex-end",
            justifyContent: "center",
            zIndex: 50,
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#fff", width: "100%", maxWidth: 420, borderRadius: "16px 16px 0 0", padding: 20, boxSizing: "border-box" , fontSize: 16 }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ fontSize: 15, fontWeight: 600 }}>{L.noteFor(selectedDate)}</div>
              <button onClick={() => setSelectedDate(null)} style={{ background: "none", border: "none", color: T.textMuted, cursor: "pointer" , fontSize: 16 }}>
                "✕"
              </button>
            </div>
            <textarea
              value={noteDraft}
              onChange={(e) => setNoteDraft(e.target.value)}
              rows={4}
              placeholder={L.notePlaceholder}
              style={{
                width: "100%",
                border: `1px solid ${T.border}`,
                borderRadius: 8,
                padding: 10,
                fontSize: 14,
                outline: "none",
                boxSizing: "border-box",
                resize: "none",
                fontFamily: "inherit",
                color: T.text,
              }}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <button
                onClick={() => setSelectedDate(null)}
                style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${T.border}`, background: "#fff", fontSize: 14, cursor: "pointer", color: T.text }}
              >
                {L.close}
              </button>
              <button
                onClick={saveNote}
                style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
              >
                {L.save}
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmDeleteProjectId && (() => {
        const proj = projects.find((p) => p.id === confirmDeleteProjectId);
        if (!proj) return null;
        return (
          <div
            onClick={() => setConfirmDeleteProjectId(null)}
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(0,0,0,0.4)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              zIndex: 60,
              padding: 20,
            }}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{ background: "#fff", width: "100%", maxWidth: 340, borderRadius: 14, padding: 20, boxSizing: "border-box" }}
            >
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 8 }}>{L.deleteProjectTitle}</div>
              <div style={{ fontSize: 12.5, color: T.textSecondary, lineHeight: 1.5, marginBottom: 18 }}>
                {L.deleteProjectBody(proj.name)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={() => setConfirmDeleteProjectId(null)}
                  style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${T.border}`, background: "#fff", fontSize: 14, cursor: "pointer", color: T.text }}
                >
                  {L.cancel}
                </button>
                <button
                  onClick={confirmDeleteProject}
                  style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: "#B5504A", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                >
                  {L.delete}
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {reminderTaskId && (
        <div
          onClick={() => setReminderTaskId(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 380, borderRadius: 14, padding: 20, boxSizing: "border-box", overflowX: "auto" }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>{L.reminderTitle}</div>
            <input
              type="datetime-local"
              value={reminderDraft}
              onChange={(e) => setReminderDraft(e.target.value)}
              style={{ width: "100%", maxWidth: "100%", minWidth: 0, boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 8, padding: "9px 8px", fontSize: 13, outline: "none", color: T.text, marginBottom: 16, display: "block" }}
            />
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={clearReminder}
                style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${T.border}`, background: "#fff", fontSize: 13, cursor: "pointer", color: T.text }}
              >
                {L.reminderClear}
              </button>
              <button
                onClick={saveReminder}
                style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
              >
                {L.save}
              </button>
            </div>
          </div>
        </div>
      )}

      {firedReminder && (
        <div
          onClick={() => setFiredReminder(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 320, borderRadius: 14, padding: 22, boxSizing: "border-box", textAlign: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: T.accent, marginBottom: 10 }}>{L.reminderFiredTitle}</div>
            <div style={{ fontSize: 15, color: T.text, marginBottom: 20, wordBreak: "break-word" }}>{firedReminder.title}</div>
            <button
              onClick={() => setFiredReminder(null)}
              style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
            >
              {L.ok}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
