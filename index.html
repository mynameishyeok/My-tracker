<script>
  (function () {
    // 실제로 눈에 보이는 뷰포트 높이를 계속 다시 재서 --app-vh 로 반영.
    // iOS PWA는 백그라운드→포그라운드를 반복하면 100dvh를 다시 계산하지 않고
    // 예전 값을 그대로 쓰는 경우가 있어서, 화면을 다시 볼 때마다 강제로 재계산함.
    function measure() {
      // visualViewport.height는 키보드가 열리면 그만큼 줄어드는 값이라
      // 여기 쓰면 검색창 등에 포커스가 갈 때마다 앱 전체가 찌그러지고,
      // 키보드가 닫힐 때 타이밍이 어긋나면 계속 찌그러진 채로 남는 문제가 있었음.
      // window.innerHeight는 iOS에서 키보드와 무관하게 항상 레이아웃 뷰포트
      // 크기 그대로라서 이 용도(백그라운드↔포그라운드 재계산)에 더 안전함.
      var h = window.innerHeight;
      document.documentElement.style.setProperty('--app-vh', h + 'px');
      // 화면 크기뿐 아니라, iOS 바운스/스크롤 잔여값 때문에 body 전체가
      // 살짝 밀려 보이는 경우도 있어서 스크롤 위치 자체도 항상 맨 위로 고정함.
      if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
        window.scrollTo(0, 0);
      }
    }
    // 리사이즈/이벤트가 발생한 바로 그 프레임에는 아직 iOS가 레이아웃을
    // 다 안정시키지 못했을 수 있어서, 다음 프레임에 실제로 측정함.
    function syncAppVh() {
      requestAnimationFrame(measure);
    }
    syncAppVh();
    window.addEventListener('load', syncAppVh);
    window.addEventListener('orientationchange', syncAppVh);
    window.addEventListener('pageshow', syncAppVh);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) syncAppVh();
    });
    // 앱을 처음 켰을 때(콜드 스타트) iOS가 상태바/홈 인디케이터 등
    // 자기 UI를 완전히 안정시키기까지 약간의 시간차가 있을 수 있어서,
    // 첫 2초 동안 몇 번 더 재측정해서 최종적으로 맞는 값에 수렴하게 함.
    [50, 150, 300, 600, 1000, 1500, 2000].forEach(function (ms) {
      setTimeout(syncAppVh, ms);
    });
  })();

  (function () {
    // 대문 로고 배너 - 앱을 완전히 종료했다가 다시 켤 때(콜드 스타트)만 보임.
    // 앱 내부 탭 이동은 페이지 새로고침이 아니라서 다시 뜨지 않고,
    // 잠깐 홈으로 나갔다 들어오는 정도(백그라운드→포그라운드)로도 다시 뜨지 않음 -
    // 그 경우는 페이지 자체가 새로 로드되지 않기 때문.
    var el = document.getElementById('app-splash');
    if (!el) return;
    var hidden = false;
    function hideSplash() {
      if (hidden) return;
      hidden = true;
      el.classList.add('hide');
      setTimeout(function () { el.style.display = 'none'; }, 450);
    }
    // 타이머가 어떤 이유로든 실패해도 화면을 탭하면 바로 넘어갈 수 있게 안전장치를 둠
    el.addEventListener('click', hideSplash);
    setTimeout(hideSplash, 2000);
  })();
</script>

<script>
  // 진짜 브라우저 저장소(localStorage) 기반 저장소 - Claude 아티팩트의 window.storage와 동일한 인터페이스로 흉내냄
  window.storage = {
    get: function (key) {
      return Promise.resolve((function () {
        try {
          var v = localStorage.getItem(key);
          return v !== null ? { value: v } : null;
        } catch (e) { return null; }
      })());
    },
    set: function (key, value) {
      return Promise.resolve((function () {
        try {
          localStorage.setItem(key, value);
          return { value: value };
        } catch (e) { return null; }
      })());
    },
  };
</script>

    "10-05": { ko: "대체(개천절)", en: "Substitute Holiday" },
  },
};
function getHoliday(dateStr, lang) {
  const [y, m, d] = dateStr.split("-");
  const md = `${m}-${d}`;
  const fixed = FIXED_HOLIDAYS.find((h) => h.md === md);
  if (fixed) return fixed[lang];
  const variable = VARIABLE_HOLIDAYS[y];
  if (variable && variable[md] !== undefined) return variable[md][lang];
  return undefined;
}

function pad(n) {
  return n < 10 ? "0" + n : "" + n;
}
function toDateStr(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function toTimeStr(d) {
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function getCookie(name) {
  const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value) {
  try {
    const twoYears = 60 * 60 * 24 * 365 * 2;
    document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${twoYears}; path=/; SameSite=Lax`;
  } catch (e) {}
}
// localStorage만 쓰면 iOS Safari 등에서 저장 공간이 정리될 때 기기 ID가 사라져
// 같은 사람이 매번 새 사람으로 인식되는 문제가 있어서, 쿠키에도 같이 백업해둔다.
function getDeviceId() {
  try {
    let id = localStorage.getItem("tracker-device-id") || getCookie("tracker-device-id");
    if (!id) {
      id = "d-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    }
    localStorage.setItem("tracker-device-id", id);
    setCookie("tracker-device-id", id);
    return id;
  } catch (e) {
    return "d-" + Date.now();
  }
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

// 꾹 누르면(long-press) 수정 모달을 여는 제스처 - 오탈자 나면 지웠다 새로 만들 필요 없이 바로 고칠 수 있게 함
function longPressHandlers(onLongPress) {
  let timer = null;
  const start = () => {
    timer = setTimeout(onLongPress, 500);
  };
  const cancel = () => {
    if (timer) clearTimeout(timer);
    timer = null;
  };
  return {
    onTouchStart: start,
    onTouchMove: cancel,
    onTouchEnd: cancel,
    onMouseDown: start,
    onMouseUp: cancel,
    onMouseLeave: cancel,
    onContextMenu: (e) => {
      e.preventDefault();
      cancel();
      onLongPress();
    },
  };
}

// ---- 한글 초성 검색 지원 ----
const CHO = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
function toChoseong(str) {
  let result = "";
  for (const ch of str) {
    const code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) {
      const choIndex = Math.floor((code - 0xac00) / 588);
      result += CHO[choIndex];
    } else {
      result += ch;
    }
  }
  return result;
}
function isChoseongOnly(str) {
  return str.length > 0 && [...str].every((ch) => CHO.includes(ch));
}
function matchesSearch(target, query) {
  if (!query) return false;
  const t = (target || "").toLowerCase();
  const q = query.toLowerCase();
  if (t.includes(q)) return true;
  if (isChoseongOnly(query)) {
    return toChoseong(target || "").includes(query);
  }
  return false;
}

  };
}
function Dot({ color }) {

}
function Checkbox({ done, onClick }) {

        justifyContent: "center",
        flexShrink: 0,
        cursor: "pointer",
        padding: 0,
        fontSize: 11,
        lineHeight: 1,
      }}
    >
      {done && "✓"}
    </button>
  );
}

function App() {
  const [tab, setTab] = useState("dashboard");
  const [navPageIndex, setNavPageIndex] = useState(0);
  const [projects, setProjects] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [notes, setNotes] = useState({});
  const [weeklySummaries, setWeeklySummaries] = useState({});
  const weeklySummariesRef = useRef({});
  useEffect(() => {
    weeklySummariesRef.current = weeklySummaries;
  }, [weeklySummaries]);
  const autoSummaryRanRef = useRef(false);
  const [memos, setMemos] = useState([]);
  const [searchQuery, setSearchQuery] = useState("");
  const [confirmDeleteProjectId, setConfirmDeleteProjectId] = useState(null);
  const [language, setLanguage] = useState("ko");
  const [archiveUnassignedOnly, setArchiveUnassignedOnly] = useState(false);
  const [reminderTaskId, setReminderTaskId] = useState(null);
  const [reminderDraft, setReminderDraft] = useState("");
  const [firedReminder, setFiredReminder] = useState(null);
  const [infoTab, setInfoTab] = useState(null);
  const [fcmToken, setFcmToken] = useState(null);
  const [ready, setReady] = useState(false);

  const [deviceId] = useState(getDeviceId);
  const [plazaRooms, setPlazaRooms] = useState([]);
  const [plazaLoading, setPlazaLoading] = useState(false);
  const [plazaError, setPlazaError] = useState("");
  const [activeRoomId, setActiveRoomId] = useState(null);
  const [activeRoomName, setActiveRoomName] = useState("");
  const [roomMessages, setRoomMessages] = useState([]);
  const [createRoomOpen, setCreateRoomOpen] = useState(false);
  const [newRoomName, setNewRoomName] = useState("");
  const [newRoomPin, setNewRoomPin] = useState("");
  const [joinRoomTarget, setJoinRoomTarget] = useState(null);
  const [joinPinDraft, setJoinPinDraft] = useState("");
  const [joinError, setJoinError] = useState("");
  const [plazaVerified, setPlazaVerified] = useState({});
  const [messageDraft, setMessageDraft] = useState("");
  const [uploading, setUploading] = useState(false);
  const [confirmDeleteRoomId, setConfirmDeleteRoomId] = useState(null);

  const [newTask, setNewTask] = useState("");
  const [newTaskProj, setNewTaskProj] = useState("");

  const [newProjName, setNewProjName] = useState("");
  const [newProjCat, setNewProjCat] = useState(CATEGORIES[0]);

  const today = new Date();
  const todayStr = toDateStr(today);

  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth() + 1);
  const [selectedDate, setSelectedDate] = useState(null);
  const [noteDraft, setNoteDraft] = useState("");

  const [viewWeekStart, setViewWeekStart] = useState(getMonday(today));
  const [summaryLoading, setSummaryLoading] = useState(false);
  const [openSummaryKey, setOpenSummaryKey] = useState(null);
  const [renameTarget, setRenameTarget] = useState(null);
  const [renameDraft, setRenameDraft] = useState("");
  const [tutorialStep, setTutorialStep] = useState(0);
  const [syncCode, setSyncCode] = useState("");
  const [restoreCodeDraft, setRestoreCodeDraft] = useState("");
  const [restoreStatus, setRestoreStatus] = useState("");
  const [restoring, setRestoring] = useState(false);
  const [backupSavedAt, setBackupSavedAt] = useState(null);
  const [confirmRestoreCode, setConfirmRestoreCode] = useState(null);
  const [darkMode, setDarkMode] = useState(false);
  const [codeCopied, setCodeCopied] = useState(false);

  // .app-shell 자체를 filter로 반전시켜 다크모드를 만드는데, border-radius +
  // overflow:hidden 조합에서 가장자리에 원래 흰 배경이 아주 살짝 비치는 경우가 있어서,
  // body/html 배경 자체도 같이 검게 바꿔 어떤 미세한 틈이 있어도 안 보이게 함.
  useEffect(() => {
    document.body.style.background = darkMode ? "#000000" : "#FFFFFF";
    document.documentElement.style.background = darkMode ? "#000000" : "#FFFFFF";
  }, [darkMode]);

  const syncCodeRef = useRef("");
  useEffect(() => {
    syncCodeRef.current = syncCode;
  }, [syncCode]);
  const cloudDataRef = useRef({ tasks: [], projects: [], notes: {}, memos: [], weeklySummaries: {} });
  useEffect(() => { cloudDataRef.current.tasks = tasks; }, [tasks]);
  useEffect(() => { cloudDataRef.current.projects = projects; }, [projects]);
  useEffect(() => { cloudDataRef.current.notes = notes; }, [notes]);
  useEffect(() => { cloudDataRef.current.memos = memos; }, [memos]);
  useEffect(() => { cloudDataRef.current.weeklySummaries = weeklySummaries; }, [weeklySummaries]);
  const cloudSyncTimerRef = useRef(null);
  // 로컬 저장은 즉시 하되, 클라우드 백업은 3초 동안 추가 변경이 없을 때 한 번만 보냄
  // (메모 타이핑처럼 짧은 시간에 여러 번 저장되는 경우 매번 보내지 않기 위함)
  const scheduleCloudSync = useCallback(() => {
    if (!window.fbDb) return;
    if (cloudSyncTimerRef.current) clearTimeout(cloudSyncTimerRef.current);
    cloudSyncTimerRef.current = setTimeout(async () => {
      const code = syncCodeRef.current;
      if (!code) return;
      try {
        await window.fbDb.collection("userBackups").doc(code).set({
          tasks: cloudDataRef.current.tasks || [],
          projects: cloudDataRef.current.projects || [],
          notes: cloudDataRef.current.notes || {},
          memos: cloudDataRef.current.memos || [],
          weeklySummaries: cloudDataRef.current.weeklySummaries || {},
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        setBackupSavedAt(new Date());
      } catch (e) {
        console.error("Cloud backup failed", e);
      }
    }, 3000);
  }, []);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      let proj = null;
      let tsk = [];
      let nt = {};
      let ws = {};
      let mm = [];
      try {
        const r = await window.storage.get("tracker-projects");
        if (r && r.value) proj = JSON.parse(r.value);
      } catch (e) {}
      try {
        const r = await window.storage.get("tracker-tasks");
        if (r && r.value) tsk = JSON.parse(r.value);
      } catch (e) {}
      try {
        const r = await window.storage.get("tracker-notes");
        if (r && r.value) nt = JSON.parse(r.value);
      } catch (e) {}
      try {
        const r = await window.storage.get("tracker-weekly-summaries");
        if (r && r.value) ws = JSON.parse(r.value);
      } catch (e) {}
      try {
        const r = await window.storage.get("tracker-memos");
        if (r && r.value) mm = JSON.parse(r.value);
      } catch (e) {}
      let lang = "ko";
      try {
        const r = await window.storage.get("tracker-language");
        if (r && r.value) lang = r.value;
      } catch (e) {}
      // 동기화 코드 - iOS가 저장공간을 지워도(홈화면 재설치 등) 이 코드만 기억해두면
      // 클라우드에 백업된 내 데이터를 그대로 복원할 수 있음. 쿠키에도 같이 백업해서
      // localStorage만 지워지는 경우에는 자동으로 복구되게 해둠.
      let code = "";
      try {
        const r = await window.storage.get("tracker-sync-code");
        if (r && r.value) code = r.value;
      } catch (e) {}
      if (!code) code = getCookie("tracker-sync-code") || "";
      if (!code) {
        code = String(Math.floor(100000 + Math.random() * 900000));
      }
      try {
        await window.storage.set("tracker-sync-code", code);
        setCookie("tracker-sync-code", code);
      } catch (e) {}
      let dark = false;
      try {
        const r = await window.storage.get("tracker-dark-mode");
        if (r && r.value === "1") dark = true;
      } catch (e) {}
      if (!cancelled) {
        setProjects(proj || []);
        setTasks(tsk);
        setNotes(nt);
        setWeeklySummaries(ws);
        setMemos(mm);
        setLanguage(lang);
        setSyncCode(code);
        setDarkMode(dark);
        setReady(true);
      }
    }
    load();
    return () => {
      cancelled = true;
    };
  }, []);

  // 검색 결과 등 다른 곳에서 탭을 바꿀 때, 해당 탭이 속한 하단 네비게이션 페이지로 자동 동기화
  useEffect(() => {
    const pageIdx = NAV_PAGES.findIndex((page) => page.includes(tab));
    if (pageIdx !== -1) setNavPageIndex(pageIdx);
  }, [tab]);

  // 설정해둔 알림 시간이 지난 할 일을 10초마다 확인해서 알림을 띄움 (앱이 열려있을 때만 작동)
  // 브라우저 알림 권한이 막혀있어도 확실히 보이도록, 앱 화면 안에 직접 뜨는 알림도 함께 띄움
  useEffect(() => {
    const id = setInterval(() => {
      const now = new Date();
      setTasks((prev) => {
        let changed = false;
        let justFired = null;
        const next = prev.map((t) => {
          if (t.reminderAt && !t.reminderFired && !t.done && new Date(t.reminderAt) <= now) {
            changed = true;
            justFired = t;
            try {
              if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                new Notification(t.title);
              }
            } catch (e) {}
            return { ...t, reminderFired: true };
          }
          return t;
        });
        if (justFired) setFiredReminder(justFired);
        if (changed) {
          try {
            window.storage.set("tracker-tasks", JSON.stringify(next));
          } catch (e) {}
          return next;
        }
        return prev;
      });
    }, 10000);
    return () => clearInterval(id);
  }, []);

  const dismissFiredReminder = () => {
    const fr = firedReminder;
    setFiredReminder(null);
    if (fr && fr.firestoreReminderId && window.fbDb) {
      window.fbDb.collection("reminders").doc(fr.firestoreReminderId).update({ acknowledged: true }).catch((e) => {
        console.error("Firestore reminder acknowledge failed", e);
      });
    }
  };

  const loadPlazaRooms = useCallback(async () => {
    if (!window.fbDb) return;
    setPlazaLoading(true);
    try {
      const snap = await window.fbDb.collection("plazaRooms").orderBy("createdAt", "desc").get();
      setPlazaRooms(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    } catch (e) {
      console.error("Plaza room list failed", e);
    }
    setPlazaLoading(false);
  }, []);

  useEffect(() => {
    if (tab === "plaza" && !activeRoomId) loadPlazaRooms();
  }, [tab, activeRoomId, loadPlazaRooms]);

  const loadRoomMessages = useCallback(async (roomId) => {
    if (!window.fbDb) return;
    try {
      const snap = await window.fbDb.collection("plazaRooms").doc(roomId).collection("messages").orderBy("createdAt", "asc").get();
      setRoomMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    } catch (e) {
      console.error("Plaza messages load failed", e);
    }
  }, []);

  // 방에 들어가있는 동안 5초마다 새 메시지를 확인 (실시간 리스너 없이 가볍게 폴링)
  useEffect(() => {
    if (!activeRoomId) return;
    const id = setInterval(() => loadRoomMessages(activeRoomId), 5000);
    return () => clearInterval(id);
  }, [activeRoomId, loadRoomMessages]);

  const enterRoom = (roomId, name) => {
    setActiveRoomId(roomId);
    setActiveRoomName(name);
    setRoomMessages([]);
    loadRoomMessages(roomId);
  };

  // 방을 나가면 30초 동안은 같은 기기에서 PIN을 다시 안 물어봄
  const leaveRoom = () => {
    if (activeRoomId) {
      setPlazaVerified((prev) => ({ ...prev, [activeRoomId]: Date.now() + 30000 }));
    }
    setActiveRoomId(null);
    setActiveRoomName("");
    setRoomMessages([]);
    loadPlazaRooms();
  };

  const goHome = () => {
    setTab("dashboard");
    setNavPageIndex(0);
  };

  const openRoom = async (room) => {
    const grace = plazaVerified[room.id];
    if (grace && grace > Date.now()) {
      enterRoom(room.id, room.name);
      return;
    }
    if (!room.hasPin) {
      setPlazaError("");
      try {
        const members = room.members || [];
        if (!members.includes(deviceId)) {
          if (members.length >= 3) {
            setPlazaError(L.plazaMemberFull);
            return;
          }
          await window.fbDb.collection("plazaRooms").doc(room.id).update({
            members: firebase.firestore.FieldValue.arrayUnion(deviceId),
          });
        }
        enterRoom(room.id, room.name);
      } catch (e) {
        console.error("Plaza join failed", e);
        setPlazaError(L.plazaCreateFailed);
      }
      return;
    }
    setJoinRoomTarget(room);
    setJoinPinDraft("");
    setJoinError("");
  };

  const createPlazaRoom = async () => {
    const name = newRoomName.trim();
    const pin = newRoomPin.trim();
    setPlazaError("");
    if (!name || (pin.length > 0 && pin.length !== 4)) {
      setPlazaError(L.plazaInvalidCreate);
      return;
    }
    if (plazaRooms.length >= 5) {
      setPlazaError(L.plazaRoomsFull);
      return;
    }
    try {
      const roomRef = window.fbDb.collection("plazaRooms").doc();
      await roomRef.set({
        name,
        members: [deviceId],
        creatorDeviceId: deviceId,
        hasPin: pin.length === 4,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      if (pin.length === 4) {
        await window.fbDb.collection("plazaRoomSecrets").doc(roomRef.id).set({ pin });
      }
      setCreateRoomOpen(false);
      setNewRoomName("");
      setNewRoomPin("");
      enterRoom(roomRef.id, name);
    } catch (e) {
      console.error("Plaza room create failed", e);
      setPlazaError(L.plazaCreateFailed);
    }
  };

  const attemptJoinRoom = async () => {
    const room = joinRoomTarget;
    if (!room) return;
    const pin = joinPinDraft.trim();
    setJoinError("");
    try {
      const secretDoc = await window.fbDb.collection("plazaRoomSecrets").doc(room.id).get();
      const realPin = secretDoc.exists ? secretDoc.data().pin : null;
      if (!realPin || pin !== realPin) {
        setJoinError(L.plazaWrongPin);
        return;
      }
      const members = room.members || [];
      if (!members.includes(deviceId)) {
        if (members.length >= 3) {
          setJoinError(L.plazaMemberFull);
          return;
        }
        await window.fbDb.collection("plazaRooms").doc(room.id).update({
          members: firebase.firestore.FieldValue.arrayUnion(deviceId),
        });
      }
      setJoinRoomTarget(null);
      setJoinPinDraft("");
      enterRoom(room.id, room.name);
    } catch (e) {
      console.error("Plaza join failed", e);
      setJoinError(L.plazaCreateFailed);
    }
  };

  const sendPlazaMessage = async () => {
    const text = messageDraft.trim();
    if (!text || !activeRoomId) return;
    setMessageDraft("");
    try {
      await window.fbDb.collection("plazaRooms").doc(activeRoomId).collection("messages").add({
        type: "text",
        text,
        senderDeviceId: deviceId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      loadRoomMessages(activeRoomId);
    } catch (e) {
      console.error("Plaza send failed", e);
    }
  };

  const uploadPlazaFile = async (file) => {
    if (!file || !activeRoomId || !window.fbStorage) return;
    setUploading(true);
    setPlazaError("");
    try {
      const path = `plaza/${activeRoomId}/${Date.now()}_${file.name}`;
      const ref = window.fbStorage.ref(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      await window.fbDb.collection("plazaRooms").doc(activeRoomId).collection("messages").add({
        type: "file",
        fileName: file.name,
        fileURL: url,
        filePath: path,
        fileSize: file.size,
        senderDeviceId: deviceId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      loadRoomMessages(activeRoomId);
    } catch (e) {
      console.error("Plaza upload failed", e);
      setPlazaError(L.plazaUploadFailed);
    }
    setUploading(false);
  };

  const deletePlazaRoom = async (roomId) => {
    try {
      const msgsSnap = await window.fbDb.collection("plazaRooms").doc(roomId).collection("messages").get();
      await Promise.all(msgsSnap.docs.map(async (d) => {
        const data = d.data();
        if (data.filePath && window.fbStorage) {
          try { await window.fbStorage.ref(data.filePath).delete(); } catch (e) {}
        }
        await d.ref.delete();
      }));
      await window.fbDb.collection("plazaRoomSecrets").doc(roomId).delete();
      await window.fbDb.collection("plazaRooms").doc(roomId).delete();
      setConfirmDeleteRoomId(null);
      if (activeRoomId === roomId) leaveRoom();
      else loadPlazaRooms();
    } catch (e) {
      console.error("Plaza room delete failed", e);
    }
  };

  const saveProjects = useCallback(async (next) => {
    setProjects(next);
    try {
      await window.storage.set("tracker-projects", JSON.stringify(next));
    } catch (e) {}
    scheduleCloudSync();
  }, [scheduleCloudSync]);
  const saveTasks = useCallback(async (next) => {
    setTasks(next);
    try {
      await window.storage.set("tracker-tasks", JSON.stringify(next));
    } catch (e) {}
    scheduleCloudSync();
  }, [scheduleCloudSync]);
  const saveNotes = useCallback(async (next) => {
    setNotes(next);
    try {
      await window.storage.set("tracker-notes", JSON.stringify(next));
    } catch (e) {}
    scheduleCloudSync();
  }, [scheduleCloudSync]);
  const saveWeeklySummaries = useCallback(async (next) => {
    setWeeklySummaries(next);
    try {
      await window.storage.set("tracker-weekly-summaries", JSON.stringify(next));
    } catch (e) {}
    scheduleCloudSync();
  }, [scheduleCloudSync]);
  const saveMemos = useCallback(async (next) => {
    setMemos(next);
    try {
      await window.storage.set("tracker-memos", JSON.stringify(next));
    } catch (e) {}
    scheduleCloudSync();
  }, [scheduleCloudSync]);

  const requestRestore = () => {
    const code = restoreCodeDraft.trim();
    if (!code) return;
    setConfirmRestoreCode(code);
  };
  const confirmRestore = async () => {
    const code = confirmRestoreCode;
    if (!code || !window.fbDb) return;
    setRestoring(true);
    setRestoreStatus("");
    try {
      const doc = await window.fbDb.collection("userBackups").doc(code).get();
      if (!doc.exists) {
        setRestoreStatus(L.restoreNotFound);
        setRestoring(false);
        setConfirmRestoreCode(null);
        return;
      }
      const data = doc.data();
      const nextTasks = data.tasks || [];
      const nextProjects = data.projects || [];
      const nextNotes = data.notes || {};
      const nextMemos = data.memos || [];
      const nextWs = data.weeklySummaries || {};
      setTasks(nextTasks);
      setProjects(nextProjects);
      setNotes(nextNotes);
      setMemos(nextMemos);
      setWeeklySummaries(nextWs);
      setSyncCode(code);
      await window.storage.set("tracker-tasks", JSON.stringify(nextTasks));
      await window.storage.set("tracker-projects", JSON.stringify(nextProjects));
      await window.storage.set("tracker-notes", JSON.stringify(nextNotes));
      await window.storage.set("tracker-memos", JSON.stringify(nextMemos));
      await window.storage.set("tracker-weekly-summaries", JSON.stringify(nextWs));
      await window.storage.set("tracker-sync-code", code);
      setCookie("tracker-sync-code", code);
      setRestoreStatus(L.restoreSuccess);
      setRestoreCodeDraft("");
    } catch (e) {
      console.error("Restore failed", e);
      setRestoreStatus(L.restoreFailed);
    }
    setRestoring(false);
    setConfirmRestoreCode(null);
  };

  // 완전히 지난 (월~일이 다 끝난) 주는 사용자가 누르지 않아도 자동으로 요약을 만들어줌.
  // 아직 진행 중인 이번 주는 기존 수동 버튼으로만 생성/재생성함.
  useEffect(() => {
    if (!ready || autoSummaryRanRef.current) return;
    autoSummaryRanRef.current = true;
    (async () => {
      const currentMonday = toDateStr(getMonday(today));
      const closedWeeks = new Set();
      tasks.forEach((t) => {
        if (!t.date) return;
        const wkStart = toDateStr(getMonday(new Date(t.date + "T00:00:00")));
        if (wkStart < currentMonday) closedWeeks.add(wkStart);
      });
      const missing = Array.from(closedWeeks)
        .filter((k) => !weeklySummariesRef.current[k])
        .sort()
        .slice(-8);
      let merged = {};
      for (const wk of missing) {
        const result = await generateSummaryForWeek(new Date(wk + "T00:00:00"));
        merged = { ...merged, ...result };
      }
      if (Object.keys(merged).length > 0) {
        saveWeeklySummaries({ ...weeklySummariesRef.current, ...merged });
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ready, tasks]);

  if (!ready) {
    return (
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          height: 500,
          color: T.textMuted,
          fontFamily: "'Helvetica Neue',Arial,sans-serif",
          fontSize: 14,
        }}
      >
        {STRINGS.ko.loading}
      </div>
    );
  }

  const addTask = () => {
    const title = newTask.trim();
    if (!title) return;
    const t = {
      id: "t-" + Date.now(),
      title,
      projectId: newTaskProj || null,
      done: false,
      date: todayStr,
    };
    saveTasks([t, ...tasks]);
    setNewTask("");
  };
  const toggleTask = (id) => {
    saveTasks(tasks.map((t) => {
      if (t.id !== id) return t;
      const done = !t.done;
      return { ...t, done, completedAt: done ? new Date().toISOString() : null };
    }));
  };
  const deleteTask = (id) => {
    const tk = tasks.find((t) => t.id === id);
    if (tk && tk.firestoreReminderId && window.fbDb) {
      window.fbDb.collection("reminders").doc(tk.firestoreReminderId).delete().catch((e) => {
        console.error("Firestore reminder delete failed", e);
      });
    }
    saveTasks(tasks.filter((t) => t.id !== id));
  };
  const ensureFcmToken = async () => {
    if (fcmToken) return fcmToken;
    try {
      if (typeof Notification === "undefined" || typeof firebase === "undefined" || !firebase.messaging.isSupported()) return null;
      let perm = Notification.permission;
      if (perm === "default") perm = await Notification.requestPermission();
      if (perm !== "granted") return null;
      const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      setFcmToken(token);
      return token;
    } catch (e) {
      console.error("FCM setup failed", e);
      return null;
    }
  };
  const openReminder = (taskId) => {
    const tk = tasks.find((t) => t.id === taskId);
    setReminderDraft(tk && tk.reminderAt ? tk.reminderAt.slice(0, 16) : "");
    setReminderTaskId(taskId);
  };
  const saveReminder = async () => {
    if (!reminderDraft) {
      setReminderTaskId(null);
      return;
    }
    const tk = tasks.find((t) => t.id === reminderTaskId);
    const token = await ensureFcmToken();
    let firestoreId = tk && tk.firestoreReminderId;
    try {
      if (window.fbDb) {
        const docData = {
          title: tk ? tk.title : "",
          remindAt: firebase.firestore.Timestamp.fromDate(new Date(reminderDraft)),
          acknowledged: false,
          sentCount: 0,
          fcmToken: token || null,
        };
        if (firestoreId) {
          await window.fbDb.collection("reminders").doc(firestoreId).set(docData);
        } else {
          const ref = await window.fbDb.collection("reminders").add(docData);
          firestoreId = ref.id;
        }
      }
    } catch (e) {
      console.error("Firestore reminder save failed", e);
    }
    saveTasks(tasks.map((t) => (t.id === reminderTaskId ? { ...t, reminderAt: reminderDraft, reminderFired: false, firestoreReminderId: firestoreId || null } : t)));

  const goWeek = (delta) => setViewWeekStart(addDays(viewWeekStart, delta * 7));

  // ---- 아카이브 계산 ----
  const completedTasks = tasks.filter((t) => t.done).sort((a, b) => (a.date < b.date ? 1 : -1));

  for (const t of completedTasks) {

  const archivedSummaries = Object.entries(weeklySummaries)

  function formatWeekRangeLabel(weekStartStr) {

  }
  const WEEK_ORDINALS_KO = ["첫째", "둘째", "셋째", "넷째", "다섯째"];
  function weekOfMonthLabel(weekStartStr) {
    const d = new Date(weekStartStr);
    const n = Math.min(5, Math.ceil(d.getDate() / 7));
    if (language === "ko") return `${d.getMonth() + 1}월 ${WEEK_ORDINALS_KO[n - 1]}주`;
    const ord = n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : `${n}th`;
    return `${ord} week of ${d.toLocaleDateString("en-US", { month: "long" })}`;
  }
  const summaryItemTitle = (weekStartStr) =>

  // 완료 시점 기준 평가: 마감일 당일 완료 = 잘한 점, 1~2일 늦음 = 미흡,
  // 3일 이상 늦었거나 3일 넘도록 미완료 = 많이 부족, 그 외 아직 기한 안 지난 미완료 = 진행 중
  function taskDelayCategory(t, refDate) {
    const due = new Date(t.date + "T00:00:00");
    if (t.done) {
      if (!t.completedAt) return "onTime";
      const completed = new Date(t.completedAt);
      const completedDay = new Date(completed.getFullYear(), completed.getMonth(), completed.getDate());
      const diff = Math.round((completedDay - due) / 86400000);
      if (diff <= 0) return "onTime";
      if (diff < 3) return "late";
      return "veryLate";
    }
    const diff = Math.round((refDate - due) / 86400000);
    return diff >= 3 ? "veryLate" : "open";
  }

  const generateSummaryForWeek = async (weekStartDate) => {

    const wKeyStr = toDateStr(weekStartDate);
    const wLabel = language === "ko"
      ? `${weekStartDate.getMonth() + 1}/${weekStartDate.getDate()} - ${wDates[6].getMonth() + 1}/${wDates[6].getDate()}`

    const weekTasks = tasks.filter((t) => wDates.some((d) => toDateStr(d) === t.date));
    const refDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const nameFor = (t) => {

    weekTasks.forEach((t) => {

    const fmt = (list, none) => (list.length ? list.map((s) => "- " + s).join("\n") : none);

- 아직 기한이 3일 안 지났고 미완료: 진행 중 (평가에서 감점하지 말 것)

잘한 점 (제때 완료):
${fmt(onTime, "(없음)")}

미흡 (1~2일 늦게 완료):
${fmt(late, "(없음)")}

많이 부족 (3일 이상 늦었거나 여전히 미완료):
${fmt(veryLate, "(없음)")}

진행 중 (아직 기한 안 지남):
${fmt(stillOpen, "(없음)")}

이 내용을 바탕으로 이번 주에 잘한 점과 부족했던 점을 구분해서 4~6줄로 담백하게 한국어로 요약해줘. 위 분류를 자연스럽게 반영해서 쓰고, 불릿 없이 짧은 문단으로 써줘.`
      : `Here is this week's (Monday-Sunday, ${wLabel}) task log. The grading rule is:
- Completed on its due date: did well
- Completed 1-2 days after the due date: lacking
- Completed 3+ days late, or still not done 3+ days past the due date: seriously lacking
- Due date hasn't passed 3 days yet and still open: in progress (don't penalize this)

Did well (completed on time):
${fmt(onTime, "(none)")}

Lacking (completed 1-2 days late):
${fmt(late, "(none)")}

Seriously lacking (3+ days late or still incomplete):
${fmt(veryLate, "(none)")}

In progress (due date not passed yet):
${fmt(stillOpen, "(none)")}

Write a plain, natural 4-6 sentence summary in English distinguishing what went well from what fell short this week, reflecting the categories above. Short paragraph, no bullet points.`;

    if (!GEMINI_API_KEY || GEMINI_API_KEY.indexOf("여기에") !== -1) {
      return {
        [wKeyStr]: { text: language === "ko" ? "먼저 코드 상단의 GEMINI_API_KEY 자리에 발급받은 키를 넣어주세요." : "Please add your Gemini API key to GEMINI_API_KEY near the top of the code first.", generatedAt: new Date().toISOString() },
      };

              <div style={{ height: 6, background: T.track, borderRadius: 3, overflow: "hidden", marginBottom: 8 }}>

            {projects.length === 0 && (

        return (
          <div
            onClick={() => setInfoTab(null)}
            style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 65, padding: 20 }}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{ background: "#fff", width: "100%", maxWidth: 320, borderRadius: 20, boxSizing: "border-box", maxHeight: "85vh", display: "flex", flexDirection: "column", overflow: "hidden" }}
            >
              <div style={{ padding: "20px 20px 0", overflowY: "auto", flex: 1, minHeight: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>{L[infoTab]}</div>
                <div style={{ fontSize: 13, color: T.textSecondary, lineHeight: 1.5, marginBottom: 18, whiteSpace: "pre-line" }}>{L.tabInfo[infoTab]}</div>

                {step && (
                  <React.Fragment>
                    <div style={{ height: 1, background: T.rowBorder, marginBottom: 16 }} />
                    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>{L.tutorialTitle}</div>

                    <TutorialDemo kind={step.demo} infoTab={infoTab} language={language} L={L} viewMonth={viewMonth} viewYear={viewYear} />

                    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>{step.title}</div>
                    <div style={{ fontSize: 12.5, color: T.textSecondary, lineHeight: 1.5 }}>{step.body}</div>
                  </React.Fragment>
                )}
                <div style={{ height: 16 }} />
              </div>

              <div style={{ padding: "12px 20px 20px", flexShrink: 0 }}>
                {step && steps.length > 1 && (
                  <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 12 }}>
                    {steps.map((_, i) => (
                      <span
                        key={i}
                        style={{ width: 6, height: 6, borderRadius: "50%", background: i === stepIdx ? T.accent : T.track }}
                      />
                    ))}
                  </div>
                )}

                {step && steps.length > 1 && (
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    {stepIdx > 0 && (
                      <button
                        onClick={() => setTutorialStep(stepIdx - 1)}
                        style={{ flex: 1, height: 40, borderRadius: 12, border: `1px solid ${T.border}`, background: "#fff", fontSize: 13, cursor: "pointer", color: T.text }}
                      >
                        {L.tutorialPrev}
                      </button>
                    )}
                    {stepIdx < steps.length - 1 && (
                      <button
                        onClick={() => setTutorialStep(stepIdx + 1)}
                        style={{ flex: 1, height: 40, borderRadius: 12, border: `1px solid ${T.border}`, background: "#fff", fontSize: 13, cursor: "pointer", color: T.text }}
                      >
                        {L.tutorialNext}
                      </button>
                    )}
                  </div>
                )}

                <button
                  onClick={() => setInfoTab(null)}
                  style={{ width: "100%", padding: "10px 0", borderRadius: 12, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                >
                  {L.ok}
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {firedReminder && (
        <div
          onClick={dismissFiredReminder}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 320, borderRadius: 20, padding: 22, boxSizing: "border-box", textAlign: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: T.accent, marginBottom: 10 }}>{L.reminderFiredTitle}</div>
            <div style={{ fontSize: 15, color: T.text, marginBottom: 20, wordBreak: "break-word" }}>{firedReminder.title}</div>
            <button
              onClick={dismissFiredReminder}
              style={{ width: "100%", padding: "11px 0", borderRadius: 12, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
            >
              {L.ok}
            </button>
          </div>
        </div>
      )}

      {openSummaryKey && weeklySummaries[openSummaryKey] && (
        <div
          onClick={() => setOpenSummaryKey(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 75, padding: 20 }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#fff", width: "100%", maxWidth: 380, maxHeight: "80vh", overflowY: "auto", borderRadius: 20, padding: 20, boxSizing: "border-box" }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
              <div style={{ fontSize: 15, fontWeight: 700, wordBreak: "break-word" }}>{summaryItemTitle(openSummaryKey)}</div>
              <button onClick={() => setOpenSummaryKey(null)} style={{ background: "none", border: "none", color: T.textMuted, cursor: "pointer", flexShrink: 0, fontSize: 16 }}>
                ✕
              </button>
            </div>
            <div style={{ fontSize: 11, color: T.textMuted, marginBottom: 14 }}>{formatWeekRangeLabel(openSummaryKey)}</div>
            <div style={{ fontSize: 13.5, color: T.text, lineHeight: 1.7, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{weeklySummaries[openSummaryKey].text}</div>
          </div>
        </div>
      )}

      {createRoomOpen && (
        <div
          onClick={() => setCreateRoomOpen(false)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 340, borderRadius: 20, padding: 20, boxSizing: "border-box" }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>{L.plazaCreateRoom}</div>
            <input
              value={newRoomName}
              onChange={(e) => setNewRoomName(e.target.value)}
              placeholder={L.plazaRoomNamePlaceholder}
              style={{ width: "100%", height: 40, boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 12, padding: "0 12px", fontSize: 13.5, outline: "none", color: T.text, marginBottom: 10 }}
            />
            <div style={{ fontSize: 11, color: T.textMuted, marginBottom: 6 }}>{L.plazaPinOptionalHint}</div>
            <input
              value={newRoomPin}
              onChange={(e) => setNewRoomPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
              placeholder={L.plazaPinPlaceholder}
              inputMode="numeric"
              maxLength={4}
              style={{ width: "100%", height: 40, boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 12, padding: "0 12px", fontSize: 13.5, outline: "none", color: T.text, marginBottom: 10, letterSpacing: 4 }}
            />
            {plazaError && <div style={{ fontSize: 12, color: T.warn, marginBottom: 10 }}>{plazaError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={() => setCreateRoomOpen(false)}
                style={{ flex: 1, height: 40, borderRadius: 12, border: `1px solid ${T.border}`, background: "#fff", fontSize: 13, cursor: "pointer", color: T.text }}
              >
                {L.cancel}
              </button>
              <button
                onClick={createPlazaRoom}
                style={{ flex: 1, height: 40, borderRadius: 12, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
              >
                {L.save}
              </button>
            </div>
          </div>
        </div>
      )}

      {joinRoomTarget && (
        <div
          onClick={() => setJoinRoomTarget(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 320, borderRadius: 20, padding: 20, boxSizing: "border-box", textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{joinRoomTarget.name}</div>
            <div style={{ fontSize: 12.5, color: T.textSecondary, marginBottom: 14 }}>{L.plazaEnterPinTitle}</div>
            <input
              value={joinPinDraft}
              onChange={(e) => setJoinPinDraft(e.target.value.replace(/\D/g, "").slice(0, 4))}
              onKeyDown={(e) => { if (e.key === "Enter") attemptJoinRoom(); }}
              inputMode="numeric"
              maxLength={4}
              autoFocus
              style={{ width: "100%", height: 44, boxSizing: "border-box", border: `1px solid ${T.border}`, borderRadius: 12, padding: "0 12px", fontSize: 18, outline: "none", color: T.text, marginBottom: 10, textAlign: "center", letterSpacing: 8 }}
            />
            {joinError && <div style={{ fontSize: 12, color: T.warn, marginBottom: 10 }}>{joinError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={() => setJoinRoomTarget(null)}
                style={{ flex: 1, height: 40, borderRadius: 12, border: `1px solid ${T.border}`, background: "#fff", fontSize: 13, cursor: "pointer", color: T.text }}
              >
                {L.cancel}
              </button>
              <button
                onClick={attemptJoinRoom}
                style={{ flex: 1, height: 40, borderRadius: 12, border: "none", background: T.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
              >
                {L.plazaEnterRoom}
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmDeleteRoomId && (
        <div
          onClick={() => setConfirmDeleteRoomId(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 65, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 320, borderRadius: 20, padding: 20, boxSizing: "border-box" }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 8 }}>{L.plazaDeleteRoomTitle}</div>
            <div style={{ fontSize: 13, color: T.textSecondary, marginBottom: 18 }}>{L.plazaDeleteRoomBody}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={() => setConfirmDeleteRoomId(null)}
                style={{ flex: 1, padding: "10px 0", borderRadius: 12, border: `1px solid ${T.border}`, background: "#fff", fontSize: 14, cursor: "pointer", color: T.text }}
              >
                {L.cancel}
              </button>
              <button
                onClick={() => deletePlazaRoom(confirmDeleteRoomId)}
                style={{ flex: 1, padding: "10px 0", borderRadius: 12, border: "none", background: T.warn, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
              >
                {L.delete}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
